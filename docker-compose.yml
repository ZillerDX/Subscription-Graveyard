services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: subgraveyard-db
    environment:
      POSTGRES_USER: subgraveyard
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: subscription_graveyard_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subgraveyard"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - subgraveyard-network

  # pgAdmin (Optional - for database management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: subgraveyard-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@subgraveyard.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - subgraveyard-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  subgraveyard-network:
    driver: bridge
